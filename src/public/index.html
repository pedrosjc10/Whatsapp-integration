<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Multi-SaaS + Trello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <header>
            <div class="logo-area">
                <div class="logo-box">💬</div>
                <div>
                    <h1 style="font-family: 'Outfit'; font-size: 24px;">WhatsApp Trello SaaS</h1>
                    <p style="font-size: 12px; color: var(--text-secondary);">Cada sessão com seu próprio quadro</p>
                </div>
            </div>
            <div id="globalTrelloStatus" class="status-pill connected"
                style="background: var(--accent-trello); color: #fff;">
                SaaS Ativo 🚀
            </div>
        </header>

        <!-- Grade de Sessões -->
        <div class="sessions-grid" id="sessionsGrid">
            <!-- Sessions will be loaded here -->
            <div class="session-card add-session-card" onclick="promptNewSession()">
                <span style="font-size: 32px;">+</span>
                <span>Nova Sessão</span>
            </div>
        </div>

        <div class="main-layout">
            <!-- Painel de Controle (WhatsApp e Trello Config) -->
            <div class="panel">
                <div class="panel-title"><span>⚙️</span> Sessão: <span id="currentSessionName">default</span></div>

                <!-- Status do Trello -->
                <div class="trello-config-box" id="trelloConfigBox"
                    style="border: none; background: rgba(0,0,0,0.1); margin-bottom: 20px;">
                    <p id="trelloStatusMsg" style="font-size: 13px; text-align: center; color: #fff;">
                        ⌛ Carregando status do Trello...
                    </p>
                </div>

                <!-- Configuração de Filtros SaaS -->
                <div
                    style="padding: 15px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 24px;">
                    <div
                        style="font-size: 12px; font-weight: 700; color: var(--accent-blue); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;">
                        🎯 Filtros de Automação
                    </div>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label style="font-size: 11px;">Palavras-Chave (ex: ok, feito)</label>
                        <input type="text" id="filterKeywords" placeholder="Vazio = Todas"
                            style="height: 38px; font-size: 13px;">
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label style="font-size: 11px;">Mídias (ex: image, video)</label>
                        <input type="text" id="filterMediaTypes" placeholder="Tipos de arquivo"
                            style="height: 38px; font-size: 13px;">
                    </div>
                    <button class="btn btn-primary" style="width: 100%; height: 38px; font-size: 13px;"
                        onclick="saveFilters()">
                        💾 Salvar Filtros
                    </button>
                </div>

                <!-- Envio de Mensagem -->
                <div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border);">
                    <div class="panel-title"><span>📤</span> Enviar Mensagem</div>
                    <div class="form-group">
                        <label>Número do Cliente</label>
                        <input type="text" id="targetNumber" placeholder="5512999998888">
                    </div>
                    <div class="form-group">
                        <label>Mensagem</label>
                        <textarea id="messageText" rows="4" placeholder="Digite aqui..."></textarea>
                    </div>
                    <button class="btn btn-primary" style="width: 100%;" onclick="sendMessage()">
                        <span>📨</span> Enviar e Confirmar no Trello
                    </button>
                </div>
            </div>

            <!-- Chat History -->
            <div class="panel">
                <div class="panel-title" style="justify-content: space-between;">
                    <span>💬 Histórico</span>
                    <div style="display:flex; gap:8px;">
                        <button class="status-pill connected" style="cursor:pointer;"
                            onclick="loadHistory('sent')">Enviadas</button>
                        <button class="status-pill awaiting_qr" style="cursor:pointer;"
                            onclick="loadHistory('received')">Recebidas</button>
                    </div>
                </div>
                <div class="msg-list" id="historyList">
                    <div style="text-align:center; color: var(--text-secondary); margin-top: 40px;">Selecione uma sessão
                    </div>
                </div>
            </div>

            <!-- Trello Actions -->
            <div class="panel">
                <div class="panel-title"><span>⚡</span> Log de Automação</div>
                <div id="trelloActions">
                    <div style="text-align:center; color: var(--text-secondary); margin-top: 40px;">Buscando ações...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        let currentSession = null;
        let instances = [];
        let userData = null;

        /**
         * Verifica o login e pega os dados do usuário
         */
        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();

                if (!data.success) {
                    window.location.href = '/login';
                    return;
                }

                userData = data.user;
                currentSession = userData.sessionId;
                document.getElementById('currentSessionName').textContent = userData.email;

                // Preencher filtros existentes
                if (userData.filterKeywords) document.getElementById('filterKeywords').value = userData.filterKeywords.join(', ');
                if (userData.filterMediaTypes) document.getElementById('filterMediaTypes').value = userData.filterMediaTypes.join(', ');

                // Inicializar dashboard com os dados do usuário
                await initDashboard();
            } catch (err) {
                window.location.href = '/login';
            }
        }

        async function saveFilters() {
            const keywords = document.getElementById('filterKeywords').value;
            const mediaTypes = document.getElementById('filterMediaTypes').value;

            toast("Salvando filtros...", "info");

            const res = await fetch('/api/auth/filters', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ keywords, mediaTypes, sessionId: currentSession })
            });

            const data = await res.json();
            if (data.success) {
                toast("Filtros atualizados!", "success");
            } else {
                toast("Erro ao salvar filtros", "error");
            }
        }

        async function initDashboard() {
            // Garantir que a sessão dele exista no servidor (caso seja novo)
            await fetch('/api/status/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: currentSession })
            });

            loadSessions();
            loadTrelloActions();
            loadTrelloStatus();
            setInterval(loadSessions, 7000);
        }

        async function loadSessions() {
            try {
                const res = await fetch('/api/status/all');
                const data = await res.json();
                instances = data.data;

                const grid = document.getElementById('sessionsGrid');
                // const addCard = grid.querySelector('.add-session-card'); // Removed as per instruction
                grid.innerHTML = '';

                // Mostrar apenas a sessão do usuário ou todas se for admin? (Por enquanto, focar no dele)
                const userSession = instances.find(i => i.id === currentSession);

                if (userSession) {
                    const inst = userSession;
                    const card = document.createElement('div');
                    card.className = `session-card active`;
                    // card.onclick = () => selectSession(inst.id); // Removed as per instruction

                    let statusText = inst.status.replace('_', ' ');
                    let qrHtml = '';

                    if (inst.status === 'awaiting_qr') {
                        qrHtml = `<div class="qr-placeholder" id="qr-${inst.id}">⌛ Carregando QR...</div>`;
                        loadQR(inst.id);
                    }

                    card.innerHTML = `
                        <div class="session-header">
                            <span class="session-id">${inst.id}</span>
                            <span class="status-pill ${inst.status}">${statusText}</span>
                        </div>
                        <div style="font-size:12px; display:flex; justify-content:space-between; align-items:center;">
                            <span>${inst.number || 'Escaneie o QR Code'}</span>
                            <!-- <span style="font-size:10px; color:${inst.hasQR ? 'var(--accent-blue)' : 'var(--text-secondary)'}">
                                ${inst.status === 'connected' ? '✅ Online' : '⚙️ Configurando'}
                            </span> -->
                        </div>
                        ${qrHtml}
                        <!-- <div style="margin-top:10px; display:flex; gap:5px;">
                            <button class="btn btn-secondary" style="flex:1; padding:5px; font-size:10px;" onclick="event.stopPropagation(); logout('${inst.id}')">Sair</button>
                        </div> -->
                    `;
                    grid.appendChild(card);
                } else {
                    grid.innerHTML = '<div style="color:var(--text-secondary)">Inicializando sua conexão...</div>';
                }
                // grid.appendChild(addCard); // Removed as per instruction
            } catch (e) { console.error("Erro loadSessions", e); }
        }

        async function loadQR(id) {
            const res = await fetch(`/api/status/qr?sessionId=${id}`);
            const data = await res.json();
            const container = document.getElementById(`qr-${id}`);
            if (container && data.data.qrCode) {
                container.innerHTML = `<img src="${data.data.qrCode}">`;
            }
        }

        // async function selectSession(id) { // Removed as per instruction
        //     currentSession = id;
        //     document.getElementById('currentSessionName').textContent = id;
        //     loadSessions();
        //     loadHistory('sent');
        //     loadTrelloStatus();
        // }

        async function loadTrelloStatus() {
            const res = await fetch(`/api/trello/status?sessionId=${currentSession}`);
            const data = await res.json();
            const box = document.getElementById('trelloConfigBox');
            const msg = document.getElementById('trelloStatusMsg');

            if (data.data.configured) {
                box.classList.add('configured');
                msg.innerHTML = `🟢 Conectado ao Board: <b>${data.data.board.name}</b>`;
            } else {
                box.classList.remove('configured');
                msg.textContent = "🔴 Trello não configurado para sua conta.";
            }
        }

        async function sendMessage() {
            const number = document.getElementById('targetNumber').value;
            const text = document.getElementById('messageText').value;

            if (!number || !text) return toast("Número e mensagem obrigatórios", "error");

            const res = await fetch('/api/messages/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ number, text, sessionId: currentSession })
            });
            const data = await res.json();

            if (data.success) {
                toast("Enviado!", "success");
                document.getElementById('messageText').value = '';
                loadHistory('sent');
                setTimeout(loadTrelloActions, 2000);
            } else {
                toast(data.error, "error");
            }
        }

        // Funções auxiliares (History, Logout, Toast, etc) - Mantendo a lógica anterior
        async function loadHistory(type) {
            const res = await fetch(`/api/messages/${type}?sessionId=${currentSession}`);
            const data = await res.json();
            const list = document.getElementById('historyList');
            list.innerHTML = data.data.length ? '' : '<div style="text-align:center; color: var(--text-secondary); margin-top: 40px;">Histórico vazio</div>';
            data.data.forEach(msg => {
                const item = document.createElement('div');
                item.className = `msg-item ${type}`;
                item.innerHTML = `<div class="msg-meta"><span>${msg.to || msg.from}</span><span>${new Date(msg.timestamp).toLocaleTimeString()}</span></div><div class="msg-content">${msg.content}</div>`;
                list.appendChild(item);
            });
        }

        async function loadTrelloActions() {
            const res = await fetch('/api/trello/actions');
            const data = await res.json();
            const list = document.getElementById('trelloActions');
            list.innerHTML = '';
            data.data.slice(0, 10).forEach(action => {
                const item = document.createElement('div');
                item.className = 'action-item';
                const cardsHtml = action.cards.map(c => `<a href="${c.cardUrl}" target="_blank" class="action-card-link">✅ ${c.cardName}</a>`).join(' ');
                item.innerHTML = `<div style="font-size:12px; font-weight:700;">📱 ${action.number}</div>${cardsHtml}`;
                list.appendChild(item);
            });
        }

        // async function promptNewSession() { // Removed as per instruction
        //     const name = prompt("Nome da conta/empresa:");
        //     if (name) {
        //         await fetch('/api/status/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: name }) });
        //         loadSessions();
        //     }
        // }

        // async function logout(id) { // Removed as per instruction
        //     if (!confirm(`Deseja desconectar a sessão ${id}?`)) return;
        //     await fetch('/api/status/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: id }) });
        //     loadSessions();
        // }

        function toast(msg, type) {
            const container = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast';
            t.style.borderLeft = `4px solid ${type === 'success' ? 'var(--accent-green)' : (type === 'info' ? 'var(--accent-blue)' : '#ef4444')}`;
            t.textContent = msg;
            container.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        // --- INICIALIZAÇÃO ---
        checkAuth();
    </script>
</body>

</html>
