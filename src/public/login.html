<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS WhatsApp Trello | Login Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f9fb 0%, #fffbf2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 32px;
            padding: 48px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-box {
            margin: 0 auto 24px;
            width: 64px;
            height: 64px;
            background: var(--accent-dark);
            color: #fff;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
        }

        .tab-group {
            display: flex;
            background: #f8f9fb;
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 32px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border-radius: 12px;
            transition: var(--transition);
        }

        .tab-btn.active {
            background: #fff;
            color: var(--accent-dark);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            font-weight: 700;
            color: var(--accent-dark);
            margin-bottom: 10px;
            display: block;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            background: #f8f9fb;
            height: 54px;
            border: 1px solid #eef0f5;
            padding: 0 18px;
            border-radius: 14px;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--accent-yellow);
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 206, 92, 0.1);
        }

        .btn-primary {
            width: 100%;
            height: 56px;
            background: var(--accent-dark);
            color: #fff;
            border-radius: 16px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 12px;
        }

        .btn-primary:hover {
            background: #000;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .trello-fields {
            display: none;
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px dashed #eef0f5;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .trello-badge {
            display: inline-block;
            background: #fff9e6;
            color: #d4a017;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            margin-bottom: 16px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-box">💬</div>
            <h1
                style="font-family: 'Outfit'; font-size: 28px; font-weight: 800; color: var(--accent-dark); margin-bottom: 8px;">
                Crextio.io</h1>
            <p style="color: var(--text-secondary); font-size: 15px; font-weight: 500;">Simplifique sua gestão Trello +
                WhatsApp</p>
        </div>

        <div class="tab-group" id="authTabs">
            <button class="tab-btn active" data-tab="login">Entrar</button>
            <button class="tab-btn" data-tab="register">Criar Conta</button>
        </div>

        <div id="authForms">
            <div class="form-group">
                <label>E-mail Corporativo</label>
                <input type="email" id="email" placeholder="nome@empresa.com">
            </div>

            <div class="form-group">
                <label>Sua Senha</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <div class="trello-fields" id="trelloFields">
                <div class="trello-badge">Configuração Inicial</div>
                <div class="form-group">
                    <label>ID do Quadro Trello (Board ID)</label>
                    <input type="text" id="trelloBoardId" placeholder="Ex: T3vbXYKE">
                </div>
            </div>

            <button class="btn-primary" id="mainBtn" onclick="handleSubmit()">
                Acessar Plataforma
            </button>

            <p
                style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary); font-weight: 500;">
                Proteção SSL de 256 bits ativada.
            </p>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        let mode = 'login';

        document.getElementById('authTabs').onclick = (e) => {
            if (!e.target.dataset.tab) return;
            mode = e.target.dataset.tab;

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            const trelloFields = document.getElementById('trelloFields');
            const mainBtn = document.getElementById('mainBtn');

            if (mode === 'register') {
                trelloFields.style.display = 'block';
                mainBtn.textContent = 'Criar minha Conta';
            } else {
                trelloFields.style.display = 'none';
                mainBtn.textContent = 'Acessar Plataforma';
            }
        };

        async function handleSubmit() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const body = { email, password };

            if (mode === 'register') {
                body.trelloBoardId = document.getElementById('trelloBoardId').value;
                if (!body.trelloBoardId) return toast("Informe o Board ID do Trello", "error");
            }

            if (!email || !password) return toast("Preencha todos os campos", "error");

            toast(`${mode === 'login' ? 'Autenticando' : 'Criando conta'}...`, "info");

            const res = await fetch(`/api/auth/${mode}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await res.json();

            if (data.success) {
                toast(data.message, "success");
                if (mode === 'login') {
                    setTimeout(() => window.location.href = '/', 800);
                } else {
                    document.querySelector('[data-tab="login"]').click();
                    document.getElementById('email').value = email;
                    toast("Conta criada! Agora faça o login.", "success");
                }
            } else {
                toast(data.error || "Erro na operação", "error");
            }
        }

        function toast(msg, type) {
            const container = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast';
            t.style.marginTop = '10px';
            t.textContent = msg;
            container.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }
    </script>
</body>

</html>
